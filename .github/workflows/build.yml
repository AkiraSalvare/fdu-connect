name: Build

on:
  release:
    types: [published]
  push:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
  pull_request:
    types:
      - opened
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache: true

      - name: Get project dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    needs: test
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEGIN Linux ARM 5 6 7
          - { goos: linux, goarch: arm, goarm: 7 }
          - { goos: linux, goarch: arm, goarm: 6 }
          - { goos: linux, goarch: arm, goarm: 5 }
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: windows, goarch: arm64 }
          # BEGIN MIPS
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
          # END MIPS
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v3

      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$GOOS-$GOARCH$GOARM
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: ^1.25

      - name: Get project dependencies
        run: go mod download

      - name: Build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p build_assets
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=dev
          VERSION_FLAGS="-X main.fduConnectVersion=${VERSION}"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_FLAGS="-X main.fduConnectVersion=${RELEASE_TAG}"
          else
            VERSION_FLAGS="${VERSION_FLAGS} -X main.CommitID=${SHORT_SHA}"
          fi
          go build -v -o build_assets/fdu-connect -trimpath \
            -ldflags "-s -w -buildid= ${VERSION_FLAGS}" .

      - name: Rename Windows fdu-connect
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv fdu-connect fdu-connect.exe

      - name: Upload artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: fdu-connect-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: build_assets/*

      - name: Create ZIP archive
        if: github.event_name == 'release' || (github.event_name == 'push' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name))
        run: |
          pushd build_assets || exit 1
          zip -9vr ../fdu-connect-$ASSET_NAME.zip .
          popd || exit 1

      - name: Upload release binary
        if: github.event_name == 'release' || (github.event_name == 'push' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload --clobber ${{ github.event_name == 'release' && github.event.release.tag_name || 'nightly' }} fdu-connect-${{ steps.get_filename.outputs.ASSET_NAME }}.zip

  nightly:
    if: github.event_name != 'release' && github.event_name == 'push' && contains(vars.NIGHTLY_RELEASE_ENABLED_BRANCHES, github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v3

      - name: Move nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push origin nightly --force
